<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz | Mobile Quiz</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/quiz.css">
</head>
<body data-protected>
  <header class="top-nav">
    <a class="brand" href="home.html">
      <span class="brand-mark">Q</span>
      <span>Mobile Quiz</span>
    </a>
    <nav class="nav-actions" aria-label="Main navigation">
      <a class="button button-ghost" href="home.html">Categories</a>
      <button class="theme-toggle" type="button" data-theme-toggle>Dark mode</button>
    </nav>
  </header>

  <main class="container quiz-page">
    <section id="quizScreen" class="quiz-card" aria-live="polite">
      <div class="quiz-topline">
        <span id="categoryName" class="pill">Category</span>
        <span id="timerText" class="timer-text">00:00</span>
      </div>

      <div class="progress" aria-label="Quiz timer progress">
        <div id="timerProgress" class="progress-bar timer-bar"></div>
      </div>

      <div class="quiz-progress-row">
        <span id="questionCounter">Question 1 of 1</span>
        <span id="scorePreview">Score: 0</span>
      </div>
      <div class="progress" aria-label="Question progress">
        <div id="questionProgress" class="progress-bar"></div>
      </div>

      <h1 id="questionText" class="question-text">Loading question...</h1>
      <div id="answerOptions" class="answer-list"></div>
      <div id="feedback" class="feedback hidden" role="status"></div>

      <button id="nextQuestionBtn" class="button button-primary full-width hidden" type="button">Next question</button>
    </section>
  </main>

  <script defer src="js/database.js"></script>
  <script defer src="js/auth.js"></script>
  <script defer src="js/quiz.js"></script>
  <script defer src="js/darkmode.js"></script>
</body>
</html>
